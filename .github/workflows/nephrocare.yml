name: NephroCare

on:
  push:
    paths:
      - "nephrocare/**"
      - ".github/workflows/nephrocare.yml"
  pull_request:
    paths:
      - "nephrocare/**"
      - ".github/workflows/nephrocare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nephrocare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generated strings, content and foods are up to date
        run: |
          python3 tools/build_strings.py
          python3 tools/build_content.py
          python3 tools/build_foods.py
          git diff --exit-code

      - name: Unit tests (logic, content, every screen under Robolectric)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk nephrocare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nephrocare-apk
          path: |
            nephrocare/nephrocare.apk
            nephrocare/app/schemas/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: nephrocare/app/build/reports/tests/

      # A fixed release gives a stable direct link that opens on a phone:
      # https://github.com/<owner>/<repo>/releases/download/nephrocare-latest/nephrocare.apk
      - name: Publish APK as the "nephrocare-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nephrocare-latest --cleanup-tag --yes || true
          gh release create nephrocare-latest nephrocare.apk \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "NephroCare 1.1 (build ${{ github.run_number }})" \
            --notes "Build from \`${{ github.ref_name }}\` (${{ github.sha }}). Download nephrocare.apk on the phone and open it to install (Android 6.0 or newer)."
