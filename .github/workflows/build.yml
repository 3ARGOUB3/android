name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APKs
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :personnel-core:test :personnel:assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk masroufi.apk
          cp personnel/build/outputs/apk/debug/personnel-debug.apk personnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            masroufi.apk
            personnel.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer and portable app
        shell: bash
        run: ./gradlew --no-daemon "-PdesktopVersion=1.0.${{ github.run_number }}" :personnel-desktop:packageMsi :personnel-desktop:createDistributable

      - name: Collect files
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem personnel-desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName GestionPersonnel.msi
          Compress-Archive -Path personnel-desktop/build/compose/binaries/main/app/GestionPersonnel -DestinationPath GestionPersonnel-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            GestionPersonnel.msi
            GestionPersonnel-windows.zip
          if-no-files-found: error

  # A release per build gives direct download links:
  # https://github.com/<owner>/<repo>/releases/latest/download/<file>
  release:
    if: github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            masroufi.apk
            personnel.apk
            GestionPersonnel.msi
            GestionPersonnel-windows.zip
          body: |
            Build from `${{ github.ref_name }}` (${{ github.sha }}).
            - `personnel.apk`: Gestion du personnel for Android.
            - `GestionPersonnel.msi`: Gestion du personnel for Windows (installer).
            - `GestionPersonnel-windows.zip`: same for Windows without installing (unzip, run GestionPersonnel.exe).
            - `masroufi.apk`: Masroufi (expenses) for Android.
