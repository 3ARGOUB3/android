name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APKs
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :personnel-core:test :personnel:assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk masroufi.apk
          cp personnel/build/outputs/apk/debug/personnel-debug.apk personnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            masroufi.apk
            personnel.apk
          if-no-files-found: error

      # A release per build gives a direct .apk link that opens on a phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/masroufi.apk (or personnel.apk)
      - name: Publish APK as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            masroufi.apk
            personnel.apk
          body: |
            Debug build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download `masroufi.apk` (expenses) or `personnel.apk` (gestion du personnel) on the phone and open it to install.
